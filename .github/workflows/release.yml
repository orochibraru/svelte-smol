name: Release

on:
  push:
    branches: [main, next]
    # Only what ships to npm (the `build` script's inputs plus the manifest):
    # CI, docs, example and script changes never trigger a release.
    # ponytail: filters pushes, not commits; a release still counts every
    # release-worthy commit since the last tag, whatever it touched.
    paths:
      - index.ts
      - templates/**
      - package.json
      - tsconfig.json
      - tsconfig.build.json

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit + tag, create the GitHub Release
      id-token: write # npm provenance + trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Write deploy key, allowed to bypass the PR-only ruleset, so the
          # release commit and the example sync can push straight to the branch.
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile --ignore-scripts

      # `main` gets a release commit (CHANGELOG.md, package.json) and `vX.Y.Z`;
      # `next` only gets a `vX.Y.Z-next.N` tag and GitHub prerelease.
      - id: release
        uses: orochibraru/releaser@v1
        with:
          branch: ${{ github.ref_name }}
          prerelease: ${{ github.ref_name == 'next' && 'next' || '' }}
          # everything ships as a patch, breaking changes included
          rules: breaking=patch,feat=patch,docs=patch,refactor=patch

      # releaser doesn't publish to npm. Prereleases have no release commit,
      # so stamp the version here; `prepack` builds `dist/`.
      - name: Publish to npm
        if: steps.release.outputs.released == 'true'
        env:
          # Set NPM_TOKEN to fall back to token auth when npm trusted
          # publishing (OIDC) is not configured for the package.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: |
          npm pkg set version="$VERSION"
          npm publish --tag "$DIST_TAG"

      # Point the example apps at the new version and push that back (skipping CI).
      - name: Sync example versions
        if: steps.release.outputs.released == 'true'
        # waits for npm to finish processing the publish (see bump-examples.ts)
        timeout-minutes: 30
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          echo "Syncing examples to $VERSION"
          git checkout -- package.json
          bun run scripts/bump-examples.ts "$VERSION"
          if git diff --quiet -- examples; then
            echo "Examples already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples
          git commit -m "chore: sync examples to v$VERSION [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
