name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the git tag + create the GitHub Release
      issues: write # @semantic-release/github success/failure comments
      pull-requests: write
      id-token: write # npm provenance + trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set NPM_TOKEN to fall back to token auth when npm trusted
          # publishing (OIDC) is not configured for the package.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release

      # semantic-release tags HEAD when it publishes. If it did, point the
      # example apps at the new version and push that back (skipping CI).
      - name: Sync example versions
        run: |
          version="$(git tag --points-at HEAD | sed -n 's/^v//p' | sort -V | tail -1)"
          if [ -z "$version" ]; then
            echo "No release tag on HEAD; nothing to sync."
            exit 0
          fi
          echo "Syncing examples to $version"
          git checkout -- package.json
          bun run scripts/bump-examples.ts "$version"
          if git diff --quiet -- examples; then
            echo "Examples already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples
          git commit -m "chore: sync examples to v$version [skip ci]"
          git push origin HEAD:main
